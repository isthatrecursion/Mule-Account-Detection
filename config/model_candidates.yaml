    family: logistic
    C: 1.0
    max_iter: 1000
  - name: lightgbm_reference_v1
    family: lightgbm
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 15
ablation_features: []
ablation_approval_reference: null
subgroup_approval_reference: null
minimum_subgroup_rows: 30
minimum_subgroup_positives: 5
