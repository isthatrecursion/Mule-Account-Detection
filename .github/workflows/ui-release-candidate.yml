name: UI application release candidate
on:
  workflow_dispatch:
    inputs:
      python_base:
        description: Reviewed python 3.12 slim-bookworm repository@sha256 digest
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Validate immutable base input
        env:
          PYTHON_BASE: ${{ inputs.python_base }}
        run: |
          python - <<'PY'
          import os,re
          assert re.fullmatch(r"(?:docker.io/library/)?python:3\.12[^@]*-slim-bookworm@sha256:[0-9a-f]{64}",os.environ["PYTHON_BASE"])
          PY
      - name: Build the application once for API and UI
        env:
          PYTHON_BASE: ${{ inputs.python_base }}
        run: |
          docker build --build-arg "PYTHON_IMAGE=$PYTHON_BASE" -f docker/Dockerfile.app -t "mule-app:${GITHUB_SHA}" .
          docker image inspect "mule-app:${GITHUB_SHA}" --format '{{.Id}}' > application-image-id.txt
          docker save "mule-app:${GITHUB_SHA}" -o application-image.tar
          sha256sum application-image.tar > application-image.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ github.sha }}
          path: |
            application-image.tar
            application-image.tar.sha256
            application-image-id.txt
          retention-days: 7
      # Publish/promote this exact artifact/digest through the organization's release
      # process; this workflow never rebuilds per environment and never deploys.
