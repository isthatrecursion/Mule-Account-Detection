worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/secrets/ui_tls_certificate;
        ssl_certificate_key /run/secrets/ui_tls_key;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        client_max_body_size 128m;
        client_body_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        # The deployment owner supplies fixed HTTPS auth endpoint, certificate trust,
        # cookie forwarding, and the internal /_gateway_auth location.
        # Missing include prevents startup. No anonymous fallback exists.
        include /run/secrets/ui_gateway_ingress.conf;
        # API-audience bearer validation remains authoritative at the API.
        # This TLS route preserves certificate verification for UI-to-API traffic.
        location ^~ /v1/ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Mule-Session "";
            proxy_set_header X-User "";
            proxy_set_header X-Email "";
            proxy_set_header X-Role "";
            proxy_set_header X-Roles "";
            proxy_set_header X-Scope "";
            proxy_pass http://api:8000;
        }
        location / {
            auth_request /_gateway_auth;
            auth_request_set $verified_session $upstream_http_x_mule_session;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Mule-Session $verified_session;
            proxy_set_header X-User "";
            proxy_set_header X-Email "";
            proxy_set_header X-Role "";
            proxy_set_header X-Roles "";
            proxy_set_header X-Scope "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-User-Id "";
            proxy_set_header X-Actor-Id "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header Authorization "";
            proxy_pass http://ui:8501;
        }
    }
}
