name: mule-persistence
services:
  postgres:
    image: postgres:17.9-bookworm
    entrypoint: [bash, /opt/mule/postgres-entrypoint.sh]
    command: [postgres]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
      - mule_migration_password
      - mule_runtime_password
      - mule_tracking_password
      - mule_readonly_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/entrypoint.sh:/opt/mule/postgres-entrypoint.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Shared deployments use only the internal Compose network.
volumes:
  postgres_data:
secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  mule_migration_password:
    file: ./secrets/mule_migration_password
  mule_runtime_password:
    file: ./secrets/mule_runtime_password
  mule_tracking_password:
    file: ./secrets/mule_tracking_password
  mule_readonly_password:
    file: ./secrets/mule_readonly_password
